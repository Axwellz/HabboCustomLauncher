name: Validate launcher updater (PR 20)

on:
  push:
    branches:
      - 'test/launcher-updater-pr20'

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 (macOS 26)
            runner: macos-26
            profile: osx-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'
      - name: Publish release
        run: >
          dotnet publish HabboCustomLauncher.vbproj -c Release
          -p:CheckEolTargetFramework=false
          -p:PublishProfileFullPath="${{ github.workspace }}/My Project/PublishProfiles/${{ matrix.profile }}.pubxml"
      - name: Run updater and launcher window tests
        run: dotnet run --project Tests/UpdaterTests.vbproj -c Release
